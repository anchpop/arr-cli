[workspace]
resolver = "2"
members = ["crates/arr-api", "crates/arr", "crates/arr-notifierd"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
form_urlencoded = "1"
percent-encoding = "2"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
# fast enough for a glue CLI; keeps rebuild latency low for live hotfixes
opt-level = 1
debug = false
